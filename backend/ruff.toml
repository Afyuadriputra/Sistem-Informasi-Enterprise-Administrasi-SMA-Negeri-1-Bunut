target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = [
    "RUF012", # Mutable default in class attribute (standard for Django Meta)
    "UP006",  # Use list instead of List
    "UP035",  # typing.List deprecated
    "UP045",  # Optional[X] vs X | None
    "UP046",  # Generic class
    "B008",   # Do not perform function call in argument defaults
    "B904",   # Within an except clause, raise exceptions with raise ... from
    "E402",   # Module level import not at top of file (used for router mounting)
    "E501",   # Line too long
]

[lint.isort]
known-first-party = ["apps", "config"]
