openapi: 3.1.0
info:
  title: API Sistem Informasi Enterprise Administrasi SMA Negeri 1 Bunut
  version: 1.0.0
  description: Kontrak API REST resmi untuk integrasi antarmuka web SPA dan layanan
    backend Django Ninja. Menerapkan standar Contract-First Development, otorisasi
    peran (RBAC), dan pembatasan akses berbasis objek (object-level permissions).
servers:
- url: http://localhost:8000/api
  description: Lingkungan Development Lokal
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Masuk dan penerbitan token JWT
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autentikasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Terlalu banyak percobaan gagal (Rate Limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Pembaruan access token sesi
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Pasangan token baru diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token kedaluwarsa atau telah dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Mengakhiri sesi dan mencabut refresh token
      operationId: authLogout
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Sesi berhasil diakhiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Informasi profil pengguna dan penugasan peran
      operationId: authMe
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Profil pengguna aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /master/academic-years:
    get:
      tags:
      - Master Data
      summary: Daftar tahun ajaran
      operationId: listAcademicYears
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar tahun ajaran terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearListResponse'
    post:
      tags:
      - Master Data
      summary: Tambah tahun ajaran baru
      operationId: createAcademicYear
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearCreateRequest'
      responses:
        '201':
          description: Tahun ajaran berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearItem'
        '422':
          description: Kesalahan validasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /master/classes:
    get:
      tags:
      - Master Data
      summary: Daftar kelas rombel
      operationId: listClasses
      security:
      - BearerAuth: []
      parameters:
      - name: academic_year_id
        in: query
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar kelas terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassListResponse'
    post:
      tags:
      - Master Data
      summary: Buat rombel kelas baru
      operationId: createClass
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreateRequest'
      responses:
        '201':
          description: Kelas berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassItem'
  /master/students:
    get:
      tags:
      - Master Data
      summary: Daftar data siswa
      operationId: listStudents
      security:
      - BearerAuth: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StudentStatusEnum'
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar siswa terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
    post:
      tags:
      - Master Data
      summary: Tambah siswa baru
      operationId: createStudent
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201':
          description: Siswa berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentItem'
  /master/students/{id}:
    get:
      tags:
      - Master Data
      summary: Detail profil siswa
      operationId: getStudentDetail
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Data lengkap siswa beserta riwayat penempatan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetailResponse'
        '404':
          description: Siswa tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags:
      - Master Data
      summary: Perbarui profil data siswa
      operationId: updateStudent
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Data siswa berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentItem'
  /master/enrollments:
    post:
      tags:
      - Master Data
      summary: Tempatkan siswa ke dalam kelas
      operationId: createEnrollment
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreateRequest'
      responses:
        '201':
          description: Penempatan siswa berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentItem'
    get:
      tags:
      - Master Data
      summary: Daftar penempatan siswa di kelas rombel
      operationId: listEnrollments
      security:
      - BearerAuth: []
      parameters:
      - name: class_id
        in: query
        required: false
        schema:
          type: integer
      - name: student_id
        in: query
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar penempatan siswa terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
  /master/assignments:
    post:
      tags:
      - Master Data
      summary: Tetapkan penugasan guru pengampu atau wali kelas
      operationId: createClassAssignment
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassAssignmentCreateRequest'
      responses:
        '201':
          description: Penugasan berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassAssignmentItem'
    get:
      tags:
      - Master Data
      summary: Daftar penugasan guru pengampu dan wali kelas
      operationId: listClassAssignments
      security:
      - BearerAuth: []
      parameters:
      - name: class_id
        in: query
        required: false
        schema:
          type: integer
      - name: employee_id
        in: query
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar penugasan guru terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassAssignmentListResponse'
  /attendance/roster:
    get:
      tags:
      - Attendance
      summary: Ambil daftar siswa aktif kelas pada tanggal tertentu untuk form absensi
      operationId: getAttendanceRoster
      security:
      - BearerAuth: []
      parameters:
      - name: class_id
        in: query
        required: true
        schema:
          type: integer
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Roster siswa aktif beserta status absensi tersimpan (jika ada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRosterResponse'
        '403':
          description: Guru tidak ditugaskan pada kelas terkait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /attendance/bulk:
    post:
      tags:
      - Attendance
      summary: Simpan catatan kehadiran kelas harian secara atomik
      operationId: saveAttendanceBulk
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
      responses:
        '200':
          description: Kehadiran batch berhasil disimpan secara atomik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceBulkResponse'
        '403':
          description: Tidak memiliki penugasan aktif di kelas pada tanggal tersebut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Data baris tidak valid atau terdapat siswa tidak terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /attendance:
    get:
      tags:
      - Attendance
      summary: Rekapitulasi absensi terfilter periode dan kelas
      operationId: getAttendanceRecap
      security:
      - BearerAuth: []
      parameters:
      - name: class_id
        in: query
        required: false
        schema:
          type: integer
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Rekapitulasi kehadiran kelas dan daftar siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecapResponse'
  /student-affairs/cases:
    get:
      tags:
      - Student Affairs
      summary: Daftar antrean kasus kesiswaan dalam cakupan pengguna
      operationId: listStudentCases
      security:
      - BearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CaseStatusEnum'
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar kasus terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCaseListResponse'
    post:
      tags:
      - Student Affairs
      summary: Buat kasus kesiswaan baru
      operationId: createStudentCase
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCaseCreateRequest'
      responses:
        '201':
          description: Kasus berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCaseItem'
  /student-affairs/cases/{id}:
    get:
      tags:
      - Student Affairs
      summary: Detail kronologis kasus kesiswaan dan histori tindakan
      operationId: getStudentCaseDetail
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Detail kasus dan timeline tindakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCaseDetailResponse'
        '403':
          description: Tidak memiliki wewenang membaca detail kasus siswa ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /student-affairs/cases/{id}/transitions:
    post:
      tags:
      - Student Affairs
      summary: Perbarui status kasus dan rekam tindakan konseling
      operationId: transitionStudentCase
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseTransitionRequest'
      responses:
        '200':
          description: Status kasus berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseTransitionResponse'
        '409':
          description: Terjadi konflik versi (Optimistic Locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /administration/service-types:
    get:
      tags:
      - Administration
      summary: Daftar jenis layanan administrasi tata usaha yang aktif
      operationId: listServiceTypes
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Daftar jenis layanan administrasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTypeListResponse'
    post:
      tags:
      - Administration
      summary: Tambah master jenis layanan persuratan baru
      operationId: createServiceType
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceTypeCreateRequest'
      responses:
        '201':
          description: Jenis layanan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTypeItem'
  /administration/requests:
    get:
      tags:
      - Administration
      summary: Daftar antrean permohonan surat tata usaha
      operationId: listServiceRequests
      security:
      - BearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ServiceRequestStatusEnum'
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Antrean permohonan terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestListResponse'
    post:
      tags:
      - Administration
      summary: Buat permohonan persuratan baru
      operationId: createServiceRequest
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestCreateRequest'
      responses:
        '201':
          description: Permohonan surat berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestItem'
  /administration/requests/{id}:
    get:
      tags:
      - Administration
      summary: Detail data permohonan surat dan riwayat proses
      operationId: getServiceRequestDetail
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Detail permohonan, berkas lampiran, dan timeline persetujuan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestDetailResponse'
  /administration/requests/{id}/transitions:
    post:
      tags:
      - Administration
      summary: Transisi status pemrosesan atau persetujuan permohonan
      operationId: transitionServiceRequest
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceTransitionRequest'
      responses:
        '200':
          description: Status permohonan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTransitionResponse'
        '409':
          description: Terjadi konflik versi data (Optimistic Locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /administration/requests/{id}/documents:
    post:
      tags:
      - Administration
      summary: Unggah lampiran berkas dokumen privat
      operationId: uploadRequestDocument
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas PDF/JPG/PNG maksimal 5 MB
      responses:
        '201':
          description: Berkas berhasil diunggah dan disimpan privat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentItem'
        '422':
          description: Format berkas dilarang atau ukuran melebihi batas 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /administration/documents:
    get:
      tags:
      - Administration
      summary: Daftar seluruh arsip berkas terverifikasi
      operationId: listArchivedDocuments
      security:
      - BearerAuth: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar dokumen terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
  /administration/documents/{id}/download:
    get:
      tags:
      - Administration
      summary: Unduh berkas privat dengan validasi otorisasi
      operationId: downloadPrivateDocument
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Aliran berkas privat (File Stream)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Tidak memiliki hak akses mengunduh berkas ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /reports/dashboard:
    get:
      tags:
      - Reports
      summary: Ringkasan metrik dashboard teragregasi sesuai peran
      operationId: getDashboardMetrics
      security:
      - BearerAuth: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Ringkasan statistik dan antrean tugas peran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetricsResponse'
  /reports/attendance.xlsx:
    get:
      tags:
      - Reports
      summary: Ekspor rekapitulasi kehadiran ke spreadsheet Excel
      operationId: exportAttendanceExcel
      security:
      - BearerAuth: []
      parameters:
      - name: class_id
        in: query
        required: false
        schema:
          type: integer
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Berkas unduhan Microsoft Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /reports/administration.pdf:
    get:
      tags:
      - Reports
      summary: Ekspor laporan permohonan persuratan ke berkas PDF
      operationId: exportAdministrationPdf
      security:
      - BearerAuth: []
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Berkas dokumen PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /audit-logs:
    get:
      tags:
      - Audit
      summary: Penelusuran log aktivitas audit sistem
      operationId: listAuditLogs
      security:
      - BearerAuth: []
      parameters:
      - name: action
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar log audit terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '403':
          description: Akses audit log ditolak (khusus Administrator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts/users:
    get:
      tags:
      - Accounts
      summary: Daftar pengguna sistem
      operationId: listUsers
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar pengguna terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          description: Hanya Administrator yang memiliki akses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - Accounts
      summary: Tambah akun pengguna baru
      operationId: createUser
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Akun pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts/users/{id}:
    get:
      tags:
      - Accounts
      summary: Detail akun pengguna
      operationId: getUserDetail
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Detail akun pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags:
      - Accounts
      summary: Perbarui status atau peran pengguna
      operationId: updateUser
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
  /accounts/roles:
    get:
      tags:
      - Accounts
      summary: Daftar peran pengguna sistem
      operationId: listRoles
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Daftar master peran sistem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
  /master/employees:
    get:
      tags:
      - Master Data
      summary: Daftar pegawai dan guru
      operationId: listEmployees
      security:
      - BearerAuth: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Daftar pegawai terpaginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
    post:
      tags:
      - Master Data
      summary: Tambah pegawai/guru baru
      operationId: createEmployee
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Pegawai berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeItem'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token access JWT yang sah.
  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
      description: Nomor halaman data
    PageSizeQuery:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Jumlah baris data per halaman
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Data yang dimasukkan tidak memenuhi ketentuan.
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        request_id:
          type: string
          example: req-1234567890abcdef
    SuccessMessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          example: Operasi berhasil diselesaikan.
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: guru_19850101
        password:
          type: string
          format: password
          example: RahasiaSman1Bunut!
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: def50200abcd...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    LogoutRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    UserProfileResponse:
      type: object
      required:
      - id
      - username
      - name
      - roles
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: guru_19850101
        name:
          type: string
          example: Budi Santoso, S.Pd.
        employee_id:
          type: integer
          nullable: true
          example: 10
        roles:
          type: array
          items:
            type: string
          example:
          - Guru
          - Wali Kelas
        assigned_classes:
          type: array
          items:
            type: object
            properties:
              class_id:
                type: integer
              class_name:
                type: string
              role:
                type: string
    GenderEnum:
      type: string
      enum:
      - LAKI_LAKI
      - PEREMPUAN
    StudentStatusEnum:
